# Publishes cli/ to npm as @videotools/cli when main gets a new version in
# cli/package.json, and tags the commit cli-v<version>.
# npm trusted publishing: the OIDC token stands in for an npm token.
name: cli

on:
  push:
    branches:
      - main
    paths:
      - cli/package.json

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      # Node 24's npm is new enough for trusted publishing.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
        working-directory: cli
      # The file changes for its dependencies too: only a version npm lacks.
      - run: |
          version=$(node -p 'require("./package.json").version')
          npm view "@videotools/cli@$version" version 2>/dev/null | grep -q . && exit 0
          npm publish
          git tag "cli-v$version"
          git push origin "cli-v$version"
        working-directory: cli
